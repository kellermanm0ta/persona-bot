# Uma instancia por persona/contexto. A mesma imagem serve todas: o que muda e o
# `environment` (config) + `env_file` (segredos) + `volumes` (contexto e dados).
#
# Segredos: `OPENROUTER_API_KEY` vem de ./.secrets/openrouter.env; o token do bot,
# de ./.secrets/<persona>/telegram.env (um bot/token por persona no BotFather).
# A chave da OpenRouter e compartilhada.
#
# Subir tudo:  docker compose up -d --build
# Subir um:    docker compose up -d --build bukowski

name: persona-bots

x-persona: &persona
  build: .
  image: persona-bot:latest
  restart: unless-stopped
  user: "1000:1000"

services:
  bukowski:
    <<: *persona
    container_name: persona-bukowski
    env_file:
      - ./.secrets/openrouter.env
      - ./.secrets/bukowski/telegram.env
      - ./.secrets/barramento.env
    environment:
      AGENT: bukowski
      RAG_ENABLED: "true"
      RETRIEVAL: hybrid
      CONTEXT_DIR: contexto/bukowski
      STATE_DIR: /app/.state
      INDEX_ON_START: "true"
      BARRAMENTO_ENABLED: "true"
      BARRAMENTO_URL: "http://barramento:8080"
      HOME: /models
      FASTEMBED_CACHE_PATH: /models
    volumes:
      - ./contexto/bukowski:/app/contexto/bukowski:ro
      - ./data/bukowski:/app/.state
      - model-cache:/models
    networks:
      - default
      - agentes

  buda:
    <<: *persona
    container_name: persona-buda
    env_file:
      - ./.secrets/openrouter.env
      - ./.secrets/buda/telegram.env
    environment:
      AGENT: buda
      RAG_ENABLED: "false"
      STATE_DIR: /app/.state
      HOME: /models
      FASTEMBED_CACHE_PATH: /models
    volumes:
      - ./data/buda:/app/.state
      - model-cache:/models

  ramanujan:
    <<: *persona
    container_name: persona-ramanujan
    env_file:
      - ./.secrets/openrouter.env
      - ./.secrets/ramanujan/telegram.env
    environment:
      AGENT: ramanujan
      RAG_ENABLED: "false"
      STATE_DIR: /app/.state
      HOME: /models
      FASTEMBED_CACHE_PATH: /models
    volumes:
      - ./data/ramanujan:/app/.state
      - model-cache:/models

  barramento:
    <<: *persona
    container_name: persona-barramento
    entrypoint: ["/app/.venv/bin/python", "/app/barramento.py"]
    env_file:
      - ./.secrets/barramento.env
    environment:
      AGENT: barramento
      BARRAMENTO_BOTS: "pessoa,bukowski"
      BARRAMENTO_ORDEM: "pessoa,bukowski"
      BARRAMENTO_PORTA: "8080"
      BARRAMENTO_STATE: /app/.state/eventos.jsonl
      BARRAMENTO_TIMEOUT: "60"
      BARRAMENTO_MAX_MENSAGENS: "12"
      BARRAMENTO_RODADAS_PADRAO: "1"
    volumes:
      - ./data/barramento:/app/.state
    networks:
      - agentes
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/saude', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  pessoa:
    <<: *persona
    container_name: persona-pessoa
    env_file:
      - ./.secrets/openrouter.env
      - ./.secrets/pessoa/telegram.env
      - ./.secrets/barramento.env
    environment:
      AGENT: pessoa
      RAG_ENABLED: "true"
      RETRIEVAL: hybrid
      CONTEXT_DIR: contexto/pessoa
      STATE_DIR: /app/.state
      INDEX_ON_START: "true"
      BARRAMENTO_ENABLED: "true"
      BARRAMENTO_URL: "http://barramento:8080"
      HOME: /models
      FASTEMBED_CACHE_PATH: /models
    volumes:
      - ./contexto/pessoa:/app/contexto/pessoa:ro
      - ./data/pessoa:/app/.state
      - model-cache:/models
    networks:
      - default
      - agentes

volumes:
  model-cache:
    name: persona-bots_model-cache

networks:
  agentes:
    name: persona-bots_agentes
    internal: true

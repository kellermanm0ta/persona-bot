name: ci

# Valida branches de trabalho e PRs. A `main` e validada pelo `publish`
# (que tambem faz o build da imagem).
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir -r requirements-bot.txt
      - name: Compilar
        run: python -m compileall -q .
      - name: Smoke test (sem rede)
        run: |
          python - <<'PY'
          import json
          import os
          import tempfile

          import numpy as np

          os.environ["AGENT"] = "bukowski"   # independe de AGENT no ambiente
          tmp = tempfile.mkdtemp()
          os.environ["STATE_DIR"] = tmp
          os.environ["RETRIEVAL"] = "hybrid_api"
          os.environ["EMBED_MODEL"] = "baai/bge-m3"
          os.environ.pop("OPENROUTER_API_KEY", None)

          import ferramentas
          import runtime
          import barramento
          import cliente_barramento
          import telegram_bot

          # tokenizacao/limpeza nao dependem de indice
          toks = ferramentas.tokenize("A vida miseravel na cidade grande")
          assert "vida" in toks and "cidade" in toks, toks
          assert "na" not in toks and "a" not in toks, toks  # stopwords

          # a persona e lida do disco, sem rede
          agent = runtime.load_agent("bukowski")
          assert agent["prompt"], "prompt da persona vazio"
          assert runtime.bot_name(), "bot_name vazio"

          # sem corpus, a busca degrada para vazio (nao quebra)
          assert ferramentas.buscar("qualquer coisa", 4) == []
          assert ferramentas.buscar_hibrido_api("qualquer coisa", 4) == []

          # corpus minimo + vetores do modelo esperado; sem chave, a busca
          # semantica falha e cai no BM25 (fallback)
          corpus = {
              "livros": [{"nome": "T", "arquivo": "t.txt"}],
              "chunks": [
                  {"livro": "T", "texto": "a vida e a cidade"},
                  {"livro": "T", "texto": "outra coisa qualquer"},
              ],
              "tf": [{"vida": 1, "cidade": 1}, {"outra": 1, "coisa": 1}],
              "dl": [2, 2],
              "df": {"vida": 1, "cidade": 1, "outra": 1, "coisa": 1},
              "postings": {"vida": [0], "cidade": [0], "outra": [1], "coisa": [1]},
              "N": 2,
              "avgdl": 2.0,
          }
          with open(os.path.join(tmp, "corpus.json"), "w", encoding="utf-8") as f:
              json.dump(corpus, f, ensure_ascii=False)
          np.save(os.path.join(tmp, "embeddings.npy"), np.zeros((2, 4), dtype="float32"))
          with open(os.path.join(tmp, "index_meta.json"), "w", encoding="utf-8") as f:
              json.dump({"modelo": "baai/bge-m3", "dim": 4, "n": 2}, f)

          res = ferramentas.buscar_hibrido_api("vida", 4)
          assert res and res[0]["texto"] == "a vida e a cidade", res
          print("smoke ok")
          PY

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

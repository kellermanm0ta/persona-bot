# Deploy na VPS: puxa a imagem publicada no GHCR (sem build).
#
# O workflow `.github/workflows/deploy.yml` grava `.env` com `TAG=sha-<curto>`
# (ou `latest`) e envia este arquivo + `.secrets/` para ~/persona-bots na VPS.
# O contexto (obras, copyright) e o `corpus.json` NAO vao pela imagem/CI: ficam
# no host, provisionados uma vez (ver README, "Setup da VPS").
#
#   cd ~/persona-bots
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Rollback: editar TAG no .env (sha anterior) e repetir up -d.
#
# RAG hibrido com embeddings via OpenRouter (`RETRIEVAL=hybrid_api`): os trechos
# vem do `embeddings.npy` local e so a query e vetorizada pela API (~100 MB por
# bot). O indice (`corpus.json` + `embeddings.npy`) ja vem pronto da VPS.
name: persona-bots

x-persona: &persona
  image: ghcr.io/kellermanm0ta/persona-bot:${TAG:-latest}
  restart: unless-stopped
  user: "1000:1000"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  bukowski:
    <<: *persona
    container_name: persona-bukowski
    env_file:
      - ./.secrets/openrouter.env
      - ./.secrets/bukowski/telegram.env
      - ./.secrets/barramento.env
    environment:
      AGENT: bukowski
      RAG_ENABLED: "true"
      RETRIEVAL: hybrid_api
      EMBED_MODEL: baai/bge-m3
      CONTEXT_DIR: contexto/bukowski
      STATE_DIR: /app/.state
      INDEX_ON_START: "false"
      BARRAMENTO_ENABLED: "true"
      BARRAMENTO_URL: "http://barramento:8080"
    volumes:
      - ./contexto/bukowski:/app/contexto/bukowski:ro
      - ./data/bukowski:/app/.state
    networks:
      - default
      - agentes

  pessoa:
    <<: *persona
    container_name: persona-pessoa
    env_file:
      - ./.secrets/openrouter.env
      - ./.secrets/pessoa/telegram.env
      - ./.secrets/barramento.env
    environment:
      AGENT: pessoa
      RAG_ENABLED: "true"
      RETRIEVAL: hybrid_api
      EMBED_MODEL: baai/bge-m3
      CONTEXT_DIR: contexto/pessoa
      STATE_DIR: /app/.state
      INDEX_ON_START: "false"
      BARRAMENTO_ENABLED: "true"
      BARRAMENTO_URL: "http://barramento:8080"
    volumes:
      - ./contexto/pessoa:/app/contexto/pessoa:ro
      - ./data/pessoa:/app/.state
    networks:
      - default
      - agentes

  barramento:
    <<: *persona
    container_name: persona-barramento
    entrypoint: ["/app/.venv/bin/python", "/app/barramento.py"]
    env_file:
      - ./.secrets/barramento.env
    environment:
      AGENT: barramento
      BARRAMENTO_BOTS: "pessoa,bukowski"
      BARRAMENTO_ORDEM: "pessoa,bukowski"
      BARRAMENTO_PORTA: "8080"
      BARRAMENTO_STATE: /app/.state/eventos.jsonl
      BARRAMENTO_TIMEOUT: "60"
      BARRAMENTO_MAX_MENSAGENS: "12"
      BARRAMENTO_RODADAS_PADRAO: "1"
    volumes:
      - ./data/barramento:/app/.state
    networks:
      - agentes
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/saude', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  agentes:
    name: persona-bots_agentes
    internal: true
